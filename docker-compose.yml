---
services:
  queue-warden:
    image: ${QUEUE_WARDEN_IMAGE:-ghcr.io/gitsumhubs/queue-warden:latest}
    container_name: queue-warden
    environment:
      - TZ=${TZ:-Etc/UTC}
      - LOG_LEVEL=${QUEUE_WARDEN_LOG_LEVEL:-INFO}
      - LOG_PATH=/app/logs/cleanup.log
      # Optional: set these to configure without touching the Settings page.
      - SONARR_URL=${SONARR_URL:-}
      - SONARR_API_KEY=${SONARR_API_KEY:-}
      - RADARR_URL=${RADARR_URL:-}
      - RADARR_API_KEY=${RADARR_API_KEY:-}
      - BOOKMARKARR_URL=${BOOKMARKARR_URL:-}
      - BOOKMARKARR_API_KEY=${BOOKMARKARR_API_KEY:-}
      - DOWNLOAD_CLIENT_URL=${DOWNLOAD_CLIENT_URL:-}
      - DOWNLOAD_CLIENT_USERNAME=${DOWNLOAD_CLIENT_USERNAME:-}
      - DOWNLOAD_CLIENT_PASSWORD=${DOWNLOAD_CLIENT_PASSWORD:-}
      - DRY_RUN=${QUEUE_WARDEN_DRY_RUN:-}
      - FINISHED_CLEANUP_ENABLED=${FINISHED_CLEANUP_ENABLED:-}
      - FINISHED_THRESHOLD_MINUTES=${FINISHED_THRESHOLD_MINUTES:-}
      - STUCK_MIN_AGE_MINUTES=${STUCK_MIN_AGE_MINUTES:-}
      - STUCK_MIN_STREAK=${STUCK_MIN_STREAK:-}
      - RDT_CLIENT_URL=${RDT_CLIENT_URL:-}
      - RDT_CLIENT_USERNAME=${RDT_CLIENT_USERNAME:-}
      - RDT_CLIENT_PASSWORD=${RDT_CLIENT_PASSWORD:-}
      - RDT_LOG_ARCHIVE=/app/archive/rdt-cleanup.log
      # Must match restart-service's RESTART_TOKEN. Set it in .env; generate with: openssl rand -hex 32
      - RESTART_SERVICE_TOKEN=${RESTART_SERVICE_TOKEN:-}
      - RESTART_SERVICE_URL=${RESTART_SERVICE_URL:-}
    ports:
      - "${QUEUE_WARDEN_PORT:-3020}:3020"
    # Lets the container reach *arrs and the download client running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${QUEUE_WARDEN_CONFIG_PATH:-./data/config}:/app/config
      - ${QUEUE_WARDEN_STATE_PATH:-./data/state}:/app/state
      - ${QUEUE_WARDEN_LOGS_PATH:-./data/logs}:/app/logs
      - ${QUEUE_WARDEN_ARCHIVE_PATH:-./data/archive}:/app/archive:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:3020/api/status').read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - restart-service

  # The only container with Docker access. It restarts allowlisted containers and nothing else.
  # No host port is published; Queue Warden reaches it at restart-service:8080 on this network.
  restart-service:
    image: queue-warden-restart-service:local
    build: ./restart-service
    container_name: queue-warden-restart-service
    environment:
      - RESTART_TOKEN=${RESTART_SERVICE_TOKEN:?set RESTART_SERVICE_TOKEN in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
