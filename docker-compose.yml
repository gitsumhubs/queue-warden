services:
  queue-warden:
    build: .
    container_name: queue-warden
    ports:
      - "3020:3020"
    # Lets the container reach *arrs and the download client running on the host.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config:/app/config
      - ./state:/app/state
      - ./logs:/app/logs
    restart: unless-stopped
